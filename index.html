<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-600 text-white p-2 rounded-lg">
          <i data-lucide="calculator" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900 dark:text-white leading-tight">Presupuesto Express</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Calculadora de Cotizaciones</p>
        </div>
      </div>
      <button id="themeToggleBtn" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- Banner de Alertas -->
    <div id="alertBanner" class="hidden mb-6 p-4 rounded-lg flex items-center justify-between shadow-sm transition-all">
      <div class="flex items-center gap-3">
        <i id="alertIcon" data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
        <span id="alertMessage" class="text-sm font-medium"></span>
      </div>
      <button id="closeAlertBtn" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Formulario para Agregar Ítem -->
      <section class="lg:col-span-1">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm sticky top-24">
          <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-600 dark:text-emerald-400"></i>
            Agregar Ítem
          </h2>

          <form id="itemForm" class="space-y-4" novalidate>
            <div>
              <label for="itemConcept" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Concepto / Servicio *</label>
              <input type="text" id="itemConcept" placeholder="Ej: Diseño Web..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            </div>

            <div>
              <label for="itemPrice" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Precio Unitario ($) *</label>
              <input type="number" step="0.01" id="itemPrice" placeholder="Ej: 150.00" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            </div>

            <div>
              <label for="itemQty" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Cantidad *</label>
              <input type="number" id="itemQty" value="1" min="1" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm text-sm flex items-center justify-center gap-2 transition">
              <i data-lucide="plus" class="w-4 h-4"></i>
              Añadir a Cotización
            </button>
          </form>
        </div>
      </section>

      <!-- Tabla y Resumen -->
      <section class="lg:col-span-2 space-y-4">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm">
          <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4">Detalle del Presupuesto</h2>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-600 dark:text-gray-300">
              <thead class="bg-gray-50 dark:bg-gray-700/50 text-gray-700 dark:text-gray-200 uppercase text-[11px] font-semibold">
                <tr>
                  <th class="py-3 px-4">Concepto</th>
                  <th class="py-3 px-4 text-center">Cant.</th>
                  <th class="py-3 px-4 text-right">Precio</th>
                  <th class="py-3 px-4 text-right">Subtotal</th>
                  <th class="py-3 px-4 text-center">Acción</th>
                </tr>
              </thead>
              <tbody id="itemsList" class="divide-y divide-gray-200 dark:divide-gray-700">
                <!-- Se cargan dinámicamente -->
              </tbody>
            </table>

            <div id="emptyState" class="py-8 text-center">
              <i data-lucide="receipt" class="w-12 h-12 mx-auto text-gray-400 mb-2"></i>
              <p class="text-sm text-gray-500 dark:text-gray-400">No hay ítems en la cotización</p>
            </div>
          </div>

          <!-- Total final -->
          <div class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700 flex justify-between items-center">
            <span class="text-base font-bold text-gray-900 dark:text-white">Total Estimado:</span>
            <span id="totalAmount" class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">$0.00</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
