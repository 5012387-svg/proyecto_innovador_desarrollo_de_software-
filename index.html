<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas y Proyectos</title>
  <!-- Tailwind CSS para el diseño UI/UX responsivo -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

  <!-- Header / Barra Superior -->
  <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg">
          <i data-lucide="check-square" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900 dark:text-white leading-tight">TaskMaster</h1>
          <p class="text-xs text-gray-500 dark:text-gray-400">Gestor de Tareas y Proyectos</p>
        </div>
      </div>
      <button id="themeToggleBtn" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
        <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
        <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-6xl mx-auto px-4 py-8">

    <!-- Banner para Manejo de Errores y Notificaciones -->
    <div id="alertBanner" class="hidden mb-6 p-4 rounded-lg flex items-center justify-between shadow-sm transition-all">
      <div class="flex items-center gap-3">
        <i id="alertIcon" data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
        <span id="alertMessage" class="text-sm font-medium"></span>
      </div>
      <button id="closeAlertBtn" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Resumen de Estadísticas -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="bg-white dark:bg-gray-800 p-5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Total Tareas</p>
          <p id="totalTasksCount" class="text-2xl font-bold mt-1 text-gray-900 dark:text-white">0</p>
        </div>
        <div class="p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
          <i data-lucide="list" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 p-5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Pendientes</p>
          <p id="pendingTasksCount" class="text-2xl font-bold mt-1 text-amber-600 dark:text-amber-400">0</p>
        </div>
        <div class="p-3 bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 rounded-lg">
          <i data-lucide="clock" class="w-6 h-6"></i>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 p-5 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Completadas</p>
          <p id="completedTasksCount" class="text-2xl font-bold mt-1 text-emerald-600 dark:text-emerald-400">0</p>
        </div>
        <div class="p-3 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-lg">
          <i data-lucide="check-circle" class="w-6 h-6"></i>
        </div>
      </div>
    </section>

    <!-- Layout de Dos Columnas: Formulario + Lista de Tareas -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- Columna Izquierda: Formulario para Agregar Tarea -->
      <section class="lg:col-span-1">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm sticky top-24">
          <h2 class="text-lg font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600 dark:text-indigo-400"></i>
            Nueva Tarea
          </h2>

          <form id="taskForm" class="space-y-4" novalidate>
            <!-- Título -->
            <div>
              <label for="taskTitle" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Título *</label>
              <input type="text" id="taskTitle" placeholder="Ej: Diseñar interfaz..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>

            <!-- Categoría -->
            <div>
              <label for="taskCategory" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Categoría</label>
              <select id="taskCategory" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                <option value="General">General</option>
                <option value="Desarrollo">Desarrollo</option>
                <option value="Diseño">Diseño</option>
                <option value="Documentación">Documentación</option>
              </select>
            </div>

            <!-- Prioridad -->
            <div>
              <label for="taskPriority" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Prioridad</label>
              <select id="taskPriority" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                <option value="Baja">Baja</option>
                <option value="Media" selected>Media</option>
                <option value="Alta">Alta</option>
              </select>
            </div>

            <!-- Fecha límite -->
            <div>
              <label for="taskDueDate" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Fecha Límite *</label>
              <input type="date" id="taskDueDate" class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>

            <!-- Descripción -->
            <div>
              <label for="taskDesc" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Descripción</label>
              <textarea id="taskDesc" rows="3" placeholder="Detalles de la tarea..." class="w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"></textarea>
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm text-sm flex items-center justify-center gap-2 transition">
              <i data-lucide="plus" class="w-4 h-4"></i>
              Guardar Tarea
            </button>
          </form>
        </div>
      </section>

      <!-- Columna Derecha: Filtros y Lista de Tareas -->
      <section class="lg:col-span-2 space-y-4">

        <!-- Barra de Filtros y Búsqueda -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col sm:flex-row gap-3 justify-between items-center">
          <!-- Búsqueda -->
          <div class="relative w-full sm:w-64">
            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Buscar tarea..." class="w-full pl-9 pr-3 py-1.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
          </div>

          <!-- Filtros de Estado y Prioridad -->
          <div class="flex gap-2 w-full sm:w-auto">
            <select id="filterStatus" class="w-full sm:w-auto px-3 py-1.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs font-medium text-gray-700 dark:text-gray-300 focus:outline-none">
              <option value="todos">Todas</option>
              <option value="pendientes">Pendientes</option>
              <option value="completadas">Completadas</option>
            </select>

            <select id="filterPriority" class="w-full sm:w-auto px-3 py-1.5 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-xs font-medium text-gray-700 dark:text-gray-300 focus:outline-none">
              <option value="todas">Prioridad: Todas</option>
              <option value="Alta">Alta</option>
              <option value="Media">Media</option>
              <option value="Baja">Baja</option>
            </select>
          </div>
        </div>

        <!-- Lista donde se cargan dinámicamente las tareas -->
        <div id="taskList" class="space-y-3">
          <!-- Estado vacío (se muestra si no hay tareas) -->
          <div id="emptyState" class="bg-white dark:bg-gray-800 p-8 rounded-xl border border-gray-200 dark:border-gray-700 text-center">
            <i data-lucide="inbox" class="w-12 h-12 mx-auto text-gray-400 mb-3"></i>
            <h3 class="text-base font-semibold text-gray-700 dark:text-gray-300">No hay tareas registradas</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Crea una nueva tarea desde el formulario para comenzar.</p>
          </div>
        </div>

      </section>

    </div>
  </main>

  <!-- Scripts JavaScript (módulos) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
